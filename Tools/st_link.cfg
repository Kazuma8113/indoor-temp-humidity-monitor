# choose stlink/j-link/cmsis-dap etc.
source [find interface/stlink.cfg]

#transport select swd
transport select swd

#这里的stm32f4x.cfg对应的是你的板子的相应芯片型号
source [find target/stm32f4x.cfg]

# download speed = 10MHz / stlink = 4MHz
# 克隆 ST-Link + 杜邦线时 4MHz 容易握手不稳，降到 1MHz。
# 注意：1800kHz 时 NRST 复位后 SWD 重连会超时（报 timed out while waiting for target halted），
# 必须真正降到 1MHz，别只看注释。
adapter speed 1000

# CLion 会在 init 之后自己把速率设回 2000kHz，那个速率下克隆 ST-Link 撑不住，
# 表现为 "Fail reading CTRL/STAT register. Force reconnect" + 读内存全 0。
# 用事件钩子在每次 GDB 连接、每次复位结束后都强制降回 1MHz。
# 必须放在 source target/stm32f4x.cfg 之后（依赖 $_TARGETNAME）。
$_TARGETNAME configure -event gdb-attach { adapter speed 1000 }
$_TARGETNAME configure -event reset-end { adapter speed 1000 }

# 复位方式（重要）：
# 本核心板只引出了 SWDIO/SWCLK/GND/3V3，NRST 没接到 ST-Link。
# OpenOCD 对 STM32F4 默认是 srst_only（只靠硬件复位线 NRST）复位，
# 复位线不通 → 报 "timed out while waiting for target halted" / "Unable to reset target"。
# 改成 none 后改用内核软复位（SYSRESETREQ），不需要 NRST 连线。
# reset_config none

# 复位方式：实测 RST 线不通（OpenOCD 报 "BUG: can't assert SRST"），
# 放弃硬件复位，改用内核软复位（SYSRESETREQ），不依赖 NRST 连线。
# 注意：软复位会让 SWD 短暂断开，必须配合低速率（上面的 adapter speed 1000）；
# 速率高时复位后重连会超时，报 "timed out while waiting for target halted"。
reset_config none

# 端口开关：
# CLion 靠 GDB server(3333) 下断点、读变量，必须保留；telnet/tcl 用不到就关掉。
# 本版 OpenOCD(sysprogs 0.12.0) 推荐空格写法 "gdb port"，写 gdb_port 会报 DEPRECATED。
# 关键：不能把 gdb 也 disabled —— 症状是固件能下载成功（走 SWD 直连，不经 GDB），
# 但一启动调试就报 "could not connect"，日志里只有 4444 没有 3333。
gdb port 3333
tcl port disabled
telnet port disabled
