# 任务栈水位诊断脚本（OpenOCD）
#
# 用法：
#   cd Graduation_F407
#   openocd -f st_link.cfg -f tools/dump_task_stacks.cfg
#
# 作用：把每个任务的整块栈 dump 到 %TEMP%/st_<任务名>.bin，
#       再用下面的 Python 片段扫描 FreeRTOS 的 0xA5 填充，算出栈峰值水位。
#
# 原理：configCHECK_FOR_STACK_OVERFLOW=2 时，FreeRTOS 创建任务会把整块栈填 0xA5，
#       运行中被写过的部分就不再是 0xA5。从栈底（低地址）往上找第一个非 0xA5，
#       就能算出峰值使用量。若 pxStack[0..3] 不再是 0xA5A5A5A5，说明已溢出
#       （此时会触发 vApplicationStackOverflowHook → Error_BlinkCode 死循环）。
#
# 注意：句柄地址与栈大小会随 freertos.c 改动而变化，迁移后请重新核对：
#   arm-none-eabi-nm <elf> | grep -iE "_TaskHandle$"
#   grep -n "stack_size" Core/Src/freertos.c

init
halt

# 句柄地址（按地址升序，对应 freertos.c 中 osThreadNew 的创建顺序的反序）
set handles {0x200007bc 0x200007c0 0x200007c4 0x200007c8 0x200007cc 0x200007d0 0x200007d4 0x200007d8}
# 每个任务的栈大小（字节）= stack_size 字段的值
set sizes   {512 512 512 2048 512 1024 512 512}
set names   {Fan Warm Humidifier Bluetooth DHT11 LCD LED Init}

set i 0
foreach h $handles {
  set tcb [expr {[mrw $h]}]
  set sz  [lindex $sizes $i]
  set nm  [lindex $names $i]
  set psa [expr {$tcb + 48}]
  set ps  [expr {[mrw $psa]}]
  echo "DUMPING $nm tcb=$tcb pxStack=$ps size=$sz"
  dump_image C:/Users/KAZUMA/AppData/Local/Temp/st_$nm.bin $ps $sz
  incr i
}

echo "DUMP_DONE -> 接着运行: python tools/check_stack_watermark.py"
shutdown
